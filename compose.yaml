# Connects to an optional external Supabase project; does not provision one.
services:
  worker:
    profiles: ["inference"]
    build:
      context: .
      dockerfile: ml/Worker.Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      WORKER_DATABASE_URL: ${WORKER_DATABASE_URL:-}
      WORKER_MODEL_VERSION: ${WORKER_MODEL_VERSION:-}
      WORKER_TRUST_LOCAL_ARTIFACT: ${WORKER_TRUST_LOCAL_ARTIFACT:-false}
      EVENT_RETENTION_DAYS: ${EVENT_RETENTION_DAYS:-30}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-2}
    volumes:
      - ${MODEL_ARTIFACT_DIR:-./artifacts/models/iforest-v1}:/models:ro
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ENVIRONMENT: development
      ALLOWED_ORIGINS: "http://127.0.0.1:5173,http://localhost:5173"
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-}
      DETECTION_ENABLED: ${DETECTION_ENABLED:-false}
      INGESTION_SIGNING_KEY: ${INGESTION_SIGNING_KEY:-}
      EVENT_RETENTION_DAYS: ${EVENT_RETENTION_DAYS:-30}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8000}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      api:
        condition: service_healthy
