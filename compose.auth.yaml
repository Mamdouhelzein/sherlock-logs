# Free local development realm; separate volumes and explicit loopback bindings.
name: sherlock-free-auth
services:
  db:
    image: postgres:17-alpine@sha256:562a6e0a66b5136bc28bef5944bbc2ddddf8ea0058d4016b96cee63f2edaf143
    environment:
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Run tools/free_auth.py up first}
      POSTGRES_DB: sherlock
    ports: ["127.0.0.1:54322:5432"]
    volumes: ["auth-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sherlock"]
      interval: 2s
      timeout: 3s
      retries: 30
  mail:
    image: public.ecr.aws/supabase/mailpit:v1.31.3
    ports: ["127.0.0.1:54324:8025"]
  auth:
    image: public.ecr.aws/supabase/gotrue:v2.197.0
    depends_on:
      db: { condition: service_healthy }
      mail: { condition: service_started }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:54421
      GOTRUE_SITE_URL: http://127.0.0.1:5180
      GOTRUE_URI_ALLOW_LIST: http://127.0.0.1:5180/auth/callback,http://127.0.0.1:5180/reset-password
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${LOCAL_AUTH_DB_PASSWORD}@db:5432/sherlock
      GOTRUE_DB_NAMESPACE: auth
      GOTRUE_JWT_SECRET: ${LOCAL_JWT_SECRET}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_ISSUER: http://127.0.0.1:54421/auth/v1
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: "true"
      GOTRUE_PASSWORD_MIN_LENGTH: 8
      GOTRUE_PASSWORD_REQUIRED_CHARACTERS: ""
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: 10
      GOTRUE_RATE_LIMIT_HEADER: X-Real-IP
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: 150
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 30
      GOTRUE_SMTP_ADMIN_EMAIL: security@sherlock.example.test
      GOTRUE_SMTP_HOST: mail
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_SENDER_NAME: Sherlock Logs Local
      GOTRUE_SMTP_MAX_FREQUENCY: 1m
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_HOOK_PASSWORD_VERIFICATION_ATTEMPT_ENABLED: "true"
      GOTRUE_HOOK_PASSWORD_VERIFICATION_ATTEMPT_URI: pg-functions://postgres/auth_guard/check_password_attempt
      GOTRUE_LOG_LEVEL: error
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:9999/health"]
      interval: 2s
      timeout: 3s
      retries: 30
  rest:
    image: public.ecr.aws/supabase/postgrest:v16.5
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator:${LOCAL_REST_DB_PASSWORD}@db:5432/sherlock
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${LOCAL_JWT_SECRET}
      PGRST_JWT_AUD: authenticated
      PGRST_DB_MAX_ROWS: 1000
      PGRST_LOG_LEVEL: error
  proxy:
    build:
      context: ./supabase/self-hosted
      dockerfile: Gateway.Dockerfile
    depends_on:
      auth: { condition: service_healthy }
      rest: { condition: service_started }
    environment:
      LOCAL_PUBLIC_KEY: ${LOCAL_PUBLIC_KEY}
      NGINX_ENVSUBST_FILTER: ^LOCAL_
    ports: ["127.0.0.1:54421:8080"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
  cleanup:
    profiles: [maintenance]
    build:
      context: ./supabase/self-hosted
      dockerfile: Cleanup.Dockerfile
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: sherlock
      PGUSER: sl_local_cleanup
      PGPASSWORD: ${LOCAL_CLEANUP_DB_PASSWORD:-not-configured}
      PGCONNECT_TIMEOUT: 5
      PGOPTIONS: -c statement_timeout=60000 -c lock_timeout=2000
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 64m
    restart: unless-stopped
    stop_grace_period: 5s
    logging:
      driver: json-file
      options: { max-size: 1m, max-file: "2" }
    healthcheck:
      test: [CMD-SHELL, "psql -X -qAt -c 'select private.local_retention_healthy()' 2>/dev/null | grep -qx t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
volumes:
  auth-data:
